<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Celebration — November 15</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Playfair Display', Georgia, -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1f1b2e, #0e0c15 80%);
      color: #f5ede4;
      overflow-x: hidden;
      padding: 1.5rem;
      position: relative;
    }

    .background-decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.28;
      animation: float 14s ease-in-out infinite alternate;
    }

    .b1 {
      width: 450px;
      height: 450px;
      background: #d4af37;
      top: 5%;
      left: 10%;
    }

    .b2 {
      width: 380px;
      height: 380px;
      background: #c26d83;
      bottom: 10%;
      right: 15%;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .b3 {
      width: 250px;
      height: 250px;
      background: #795290;
      top: 50%;
      left: 60%;
      animation-duration: 10s;
      animation-delay: -2s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
