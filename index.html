<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Celebration &amp; Countdown</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    }

    body {
      min-height: 100vh;
      background-color: #17131e;
      background-image: radial-gradient(circle at 50% 20%, #2f223b 0%, #17131e 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #2e2417;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Gold Sparkle Animation */
    .petals-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .petal {
      position: absolute;
      background: radial-gradient(circle, #e6ca65 0%, rgba(212, 175, 55, 0.2) 70%, transparent 100%);
      border-radius: 50%;
      opacity: 0.35;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% {
        transform: translateY(105vh) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.5;
      }
      80% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(-10vh) translateX(50px);
        opacity: 0;
      }
    }

    /* Floating Music Toggle Button */
    .music-control {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      background: #fffdf8;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      font-size: 13px;
      font-weight: 600;
      color: #7a5f22;
      transition: all 0.2s ease;
    }

    .music-control:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
    }

    .music-icon {
      font-size: 15px;
      display: inline-block;
    }

    .playing .music-icon {
      animation: pulseNote 1.2s infinite ease-in-out;
    }

    @keyframes pulseNote {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Floating Banner Prompt */
    .audio-notice {
      position: fixed;
      bottom: 16px;
      background: rgba(23, 19, 30, 0.92);
      color: #dfcaa2;
      border: 1px solid rgba(212, 175, 55, 0.45);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.5px;
      z-index: 9;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* Main Card */
    .invitation-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: #fffdfa;
      border: 2px solid #d4af37;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 25px rgba(212, 175, 55, 0.2);
      padding: 38px 22px 32px;
      text-align: center;
    }
